[project]
name = "bibliometric-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas", email = "lucasalonso@id.uff.br" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.15.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
bibliometric-rag-assistant = "bibliometric_rag_assistant:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gradio>=6.30.0",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
